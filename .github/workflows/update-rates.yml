name: Update Live Metal Rates
# Keeps MetalRate rows fresh from gold-api.com (free, no API key needed).
# Runs independently of both the Vercel app and the retailer scrapers.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Update rates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run rates:update
