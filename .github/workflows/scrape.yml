name: Scheduled Scraper Run
# Runs retailer scrapers on a schedule, completely separate from the Next.js
# app on Vercel (spec section 8: "scrapers must run independently").
#
# The CaratLane adapter (src/lib/scrapers/caratlane.ts) uses Cheerio, not
# Playwright — its pages turned out to be server-rendered, so no headless
# browser is needed here. If a future adapter needs Playwright instead, add
# an `npx playwright install --with-deps chromium` step back in for it.

on:
  schedule:
    - cron: "0 3 * * *" # once daily — adjust as needed
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape
